name: Checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHECKS_BASE: ${{ github.event.pull_request.base.sha }}
  VP_GIT_HOOKS: "0"

jobs:
  prepare:
    name: Plan and quality
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-targets: ${{ steps.plan.outputs.has-targets }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Plan checks
        id: plan
        run: bun run checks plan --committed --github
      - name: Check formatting, lint, and types
        run: bun run checks run --committed --job quality

  targets:
    name: Validate (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.has-targets == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - if: runner.os == 'Linux' && matrix.desktop
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: bun install --frozen-lockfile
      - name: Test and build affected packages
        run: bun run checks run --committed --job platform
      - uses: actions/upload-artifact@v7.0.1
        if: matrix.desktop
        with:
          name: stargeist-${{ runner.os }}-${{ runner.arch }}
          path: apps/sg-desktop/out/make/**
          if-no-files-found: error
          retention-days: 7

  required:
    name: Required checks
    needs: [prepare, targets]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject incomplete checks
        if: >-
          ${{ !(needs.prepare.result == 'success' &&
            ((needs.prepare.outputs.has-targets == 'true' && needs.targets.result == 'success') ||
             (needs.prepare.outputs.has-targets == 'false' && needs.targets.result == 'skipped'))) }}
        run: exit 1
